# Mantiene activo el proyecto de Supabase de Equilibra.
# El plan gratuito pausa los proyectos tras 7 días sin actividad;
# esta tarea hace una consulta liviana dos veces por semana.
name: Mantener Supabase activo

on:
  schedule:
    - cron: '0 12 * * 1,4'   # lunes y jueves, 12:00 UTC (09:00 en Paraguay)
  workflow_dispatch:          # permite ejecutarla a mano desde la pestaña Actions

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar la base de datos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltan los secretos SUPABASE_URL o SUPABASE_ANON_KEY en el repositorio"
            exit 1
          fi

          # Consulta mínima: con RLS devuelve una lista vacía, pero cuenta como actividad
          status=$(curl -sS -o /tmp/respuesta.json -w "%{http_code}" \
            --retry 3 --retry-delay 20 --retry-all-errors --max-time 30 \
            "${SUPABASE_URL%/}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")

          echo "Supabase respondió HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase respondió $status. Si el proyecto está pausado, reactivalo desde el panel."
            cat /tmp/respuesta.json
            exit 1
          fi
          echo "✓ Proyecto activo"
